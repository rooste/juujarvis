spring:
  application:
    name: juujarvis

server:
  port: 8080

juujarvis:
  imessage:
    polling-enabled: false
    own-handles: juujarvis@outlook.com
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
  alexa:
    # Voice turns: the fast model answers simple requests within Alexa's few seconds and hands bigger ones to
    # juujarvis.alexa.model (default: the main model above), whose answer is spoken when ready
    fast-model: claude-haiku-4-5-20251001
  confluence:
    base-url: ${CONFLUENCE_BASE_URL:}
    email: ${CONFLUENCE_EMAIL:}
    api-token: ${CONFLUENCE_API_TOKEN:}
  brave:
    api-key: ${BRAVE_API_KEY:}
  microsoft:
    client-id: ${MICROSOFT_CLIENT_ID:}
    client-secret: ${MICROSOFT_CLIENT_SECRET:}
    tenant-id: ${MICROSOFT_TENANT_ID:}
  email:
    polling-enabled: false
    default-interval-seconds: 1200
    schedules:
      - start: "07:00"
        end: "22:00"
        interval-seconds: 60
  forest:
    spreadsheet-name: ${FOREST_SPREADSHEET_NAME:}
  google:
    credentials-path: secrets/google-credentials.json
    tokens-path: secrets/google-tokens
    calendar-id: primary
  ideas:
    dir: ${IDEAS_DIR:${user.home}/ideas}
  db-path: juujarvis.db
  # Client for Bridgarvis (AWS SMS gateway). Enable in application-local.yml together with
  # the spring.ssl.bundle.pem.bridgarvis client certificate.
  bridgarvis:
    enabled: false
    url: https://localhost:8443
    # Juujarvis's own address (Bridgarvis sends from it); told to the model. Set in application-local.yml.
    email-address:
    # Gets iMessage notifications about mail to notify-only mailboxes (e.g. info@)
    notify-user: dad
    # Base URL of the mail UI used in notification links (defaults to url)
    # ui-url: https://mail.example.com

logging:
  level:
    com.juujarvis: DEBUG
  file:
    name: logs/juujarvis.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
